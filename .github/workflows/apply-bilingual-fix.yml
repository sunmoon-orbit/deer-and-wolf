name: Apply bilingual bracket fix
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-bilingual-fix.yml]
permissions:
  contents: write
jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified patch
        run: echo '' | base64 -d | git apply
      - name: Verify and publish
        run: |
          node --check js/wechat.js
          rm .github/workflows/apply-bilingual-fix.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/wechat.js .github/workflows/apply-bilingual-fix.yml
          git commit -m "fix: remove leaked bilingual message brackets"
          git push
