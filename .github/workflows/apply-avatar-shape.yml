name: Apply avatar shape toggle
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-avatar-shape.yml]
permissions:
  contents: write
jobs:
  apply-change:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified patch
        run: echo '' | base64 -d | git apply
      - name: Verify and publish
        run: |
          node --check js/wechat.js
          rm .github/workflows/apply-avatar-shape.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/wechat.js css/wechat.css .github/workflows/apply-avatar-shape.yml
          git commit -m "feat: add chat avatar shape toggle"
          git push
